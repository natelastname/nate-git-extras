[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nate-git-extras"
version = "0.1.0"
description = "Git-aware filesystem utilities"
readme = "README.md"
authors = [
  { name = "Nathan Nichols", email = "communications@resultsmotivated.com" },
]
requires-python = ">=3.10,<3.14.1"

dependencies = [
  "cyclopts>=4.22.1,<5.0.0",
  "loguru>=0.7.3,<0.8.0",
  "pytest>=8,<9",
  "basedpyright>=1.31.5,<2.0.0",
  "ruff>=0.13.2,<0.14.0",
  "mkdocs<2.0",
  "mkdocs-material>=9.7.2,<10.0.0",
]

[project.scripts]
nate-git-extras = "nate_git_extras.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore:.*unclosed.*:ResourceWarning",
]

[tool.pyright]
typeCheckingMode = "off"
reportMissingParameterType = "none"
reportMissingTypeArgument = "none"
reportUnknownParameterType = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUntypedFunctionDecorator = "none"

[tool.ruff]
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = [
  "F",  # real errors
  "I",  # import sorting
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"src/**/__init__.py" = ["F401"]
"tests/*" = ["I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
