version: "1.0.0"
title: "Project Autopilot"
description: "Top-level coding agent for this repository"
instructions: |
  You are the primary coding agent for this repository.

  First, read:
  - {{ recipe_dir }}/../AGENTS.md
  - {{ recipe_dir }}/../prompts/repo_context.md

  Behave according to AGENTS.md at all times.

  For every task:
  1. Classify the task as feature, bugfix, docs-only, tests-only, or review.
  2. Delegate implementation work to the most appropriate subrecipe.
  3. After implementation, ensure docs and tests are synchronized.
  4. Before completion, run validation commands and summarize:
     - files changed
     - tests run
     - docs updated
     - residual risks

  Never declare success if tests fail or documentation is out of sync.

prompt: "Analyze the repository and carry out the requested task using the appropriate workflow."

extensions:
  - type: builtin
    name: developer
    bundled: true

sub_recipes:
  - name: implement_feature
    path: "./implement_feature.yaml"
  - name: fix_bug
    path: "./fix_bug.yaml"
  - name: generate_tests
    path: "./generate_tests.yaml"
  - name: update_docs
    path: "./update_docs.yaml"
  - name: review_repo
    path: "./review_repo.yaml"
