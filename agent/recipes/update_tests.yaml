version: "1.0.0"
title: "Generate Tests"
description: "Create or improve tests for changed code"
instructions: |
  Read {{ recipe_dir }}/../AGENTS.md first.

  Write or update tests that:
  - verify the intended behavior
  - cover edge cases
  - include regression coverage for bug fixes
  - follow existing repo style

  Mirror the source tree when possible.
  Prefer minimal, targeted tests over broad speculative ones.

  After writing tests, run:
  - ./scripts/test_changed.sh

prompt: "Generate tests for the relevant changed code."

extensions:
  - type: builtin
    name: developer
    bundled: true
