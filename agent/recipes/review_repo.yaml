version: "1.0.0"
title: "Review Repository"
description: "Inspect project structure, risks, and missing docs/tests"
instructions: |
  Read {{ recipe_dir }}/../AGENTS.md first.

  Review the repository and produce:
  - architecture summary
  - high-risk modules
  - missing or weak tests
  - stale or missing docs
  - suggested next improvements

  Do not make edits unless explicitly asked.

prompt: "Review this repository and identify its most important engineering risks."

extensions:
  - type: builtin
    name: developer
    bundled: true

response:
  json_schema:
    type: object
    properties:
      architecture_summary:
        type: string
      high_risk_modules:
        type: array
        items:
          type: string
      missing_tests:
        type: array
        items:
          type: string
      missing_docs:
        type: array
        items:
          type: string
      suggested_next_steps:
        type: array
        items:
          type: string
    required:
      - architecture_summary
      - high_risk_modules
      - missing_tests
      - missing_docs
      - suggested_next_steps
